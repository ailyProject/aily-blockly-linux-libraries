name: Check and Deploy to NPM

on:
  push:
    branches:
      - deploy

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment configuration
        env:
          CN_REGISTRY_URL: ${{ secrets.CN_LINUX_REGISTRY_URL }}
          CN_NPM_TOKEN: ${{ secrets.CN_LINUX_NPM_TOKEN }}
          EU_REGISTRY_URL: ${{ secrets.EU_LINUX_REGISTRY_URL }}
          EU_NPM_TOKEN: ${{ secrets.EU_LINUX_NPM_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_JSON_TARGET: ${{ secrets.R2_JSON_TARGET }}
          RUSTFS_ENDPOINT: ${{ secrets.RUSTFS_ENDPOINT }}
          RUSTFS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          RUSTFS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          RUSTFS_BUCKET: ${{ secrets.RUSTFS_BUCKET }}
          RUSTFS_TARGET: ${{ secrets.RUSTFS_TARGET }}
        run: |
          if [ -z "$CN_REGISTRY_URL" ] || [ -z "$CN_NPM_TOKEN" ] || [ -z "$EU_REGISTRY_URL" ] || [ -z "$EU_NPM_TOKEN" ]; then
            echo "CN and EU Linux npm registries and tokens must all be configured."
            exit 1
          fi

          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 account, bucket, and credentials must all be configured."
            exit 1
          fi

          if [ -n "$RUSTFS_ENDPOINT$RUSTFS_ACCESS_KEY_ID$RUSTFS_SECRET_ACCESS_KEY$RUSTFS_BUCKET" ]; then
            if [ -z "$RUSTFS_ENDPOINT" ] || [ -z "$RUSTFS_ACCESS_KEY_ID" ] || [ -z "$RUSTFS_SECRET_ACCESS_KEY" ] || [ -z "$RUSTFS_BUCKET" ]; then
              echo "RustFS is optional, but partial credentials are not allowed."
              exit 1
            fi
          fi

      - name: Validate package layout and generators
        run: |
          node - <<'NODE'
          const { getPublishablePackages } = require('./scripts/genjson');
          const packages = getPublishablePackages(process.cwd());
          console.log(`Validated ${packages.length} publishable packages`);
          NODE

          for script in genjson.js genjson-ai.js generate-info.js generate-libraries-index.js generate-package-folder-map.js; do
            if [ ! -f "scripts/$script" ]; then
              echo "Missing generator: scripts/$script"
              exit 1
            fi
          done

      - name: Validate catalog generation
        run: |
          node scripts/genjson.js
          node scripts/genjson-ai.js
          node scripts/generate-info.js --all
          node scripts/generate-libraries-index.js
          node scripts/generate-package-folder-map.js
          for file in libraries-linux.json libraries-linux-ai.json libraries-linux-index.json package-folder-map-linux.json tags-linux.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done
          node --test test/linux-release-metadata.test.js

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed packages
        id: set-matrix
        run: |
          # 获取最后一次成功运行的提交SHA或默认为一个空树
          echo "Origin: $(git remote get-url origin)"
          BASE_SHA=$(git ls-remote origin "refs/tags/last-deploy^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git ls-remote origin "refs/tags/last-deploy" | awk 'NR == 1 { print $1 }')
          fi

          if [ -n "$BASE_SHA" ]; then
            echo "Using last successful deploy tag as base: $BASE_SHA"
          else
            echo "No last-deploy tag found, using Git's empty tree"
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi

          HEAD_SHA=${{ github.sha }}

          echo "Comparing $BASE_SHA...$HEAD_SHA"

          mapfile -t CHANGED_DIRS < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" |
            awk -F/ 'NF > 1 { print $1 }' |
            sort -u
          )

          declare -A CHANGED_DIR_SET=()
          for dir in "${CHANGED_DIRS[@]}"; do
            CHANGED_DIR_SET["$dir"]=1
          done

          mapfile -t PUBLISHABLE_DIRS < <(
            node -e "for (const item of require('./scripts/genjson').getPublishablePackages(process.cwd())) console.log(item.folderName)"
          )
          CHANGED_PACKAGES=()
          for dir in "${PUBLISHABLE_DIRS[@]}"; do
            if [[ -n "${CHANGED_DIR_SET[$dir]+set}" ]]; then
              CHANGED_PACKAGES+=("$dir")
            fi
          done

          if [ ${#CHANGED_PACKAGES[@]} -gt 0 ]; then
            echo "Detected changed packages: ${CHANGED_PACKAGES[*]}"
          fi

          if [ ${#CHANGED_PACKAGES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "No packages changed"
          else
            MATRIX_JSON=$(printf '%s\n' "${CHANGED_PACKAGES[@]}" | node -e '
              const fs = require("fs");
              const packages = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
              const batchSize = 64;
              const batches = [];
              for (let offset = 0; offset < packages.length; offset += batchSize) {
                batches.push({
                  batch_index: Math.floor(offset / batchSize) + 1,
                  packages_json: JSON.stringify(packages.slice(offset, offset + batchSize))
                });
              }
              process.stdout.write(JSON.stringify({ include: batches }));
            ')
            echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "Changed packages: ${CHANGED_PACKAGES[@]}"
            echo "Created $(( (${#CHANGED_PACKAGES[@]} + 63) / 64 )) publish batch(es)"
          fi


  build-and-publish:
    needs:
      - validate
      - detect-changes
    if: ${{ github.event_name == 'push' && needs.detect-changes.outputs.matrix != '{"include":[]}' && github.ref == 'refs/heads/deploy' }}
    runs-on: [self-hosted, ailydeMac-mini, macOS, ARM64]
    timeout-minutes: 120
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      # 并行发布变更包，显著缩短整体发布时间
      max-parallel: 6
      fail-fast: false
    steps:
      - name: Check UPDATE_ALL flag
        id: check-update-all
        run: |
          if [[ "${{ secrets.UPDATE_ALL }}" == "true" ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: echo matrix
        if: steps.check-update-all.outputs.should_skip != 'true'
        run: echo "${{ toJson(matrix) }}"

      - name: Checkout code
        if: steps.check-update-all.outputs.should_skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-update-all.outputs.should_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.CN_LINUX_REGISTRY_URL }}

      # - name: Install dependencies
      #   run: |
      #     cd ${{ matrix.package }}
      #     npm ci || npm install

      - name: Build package
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          PACKAGES_JSON: ${{ matrix.packages_json }}
        run: |
          PACKAGES=()
          while IFS= read -r package_dir; do
            PACKAGES+=("$package_dir")
          done < <(node -e 'for (const item of JSON.parse(process.env.PACKAGES_JSON)) console.log(item)')
          for package_dir in "${PACKAGES[@]}"; do
            echo "Building $package_dir"
            (
              cd "$package_dir"
              npm run build --if-present
            )
          done

      - name: Publish to Default Registry
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CN_LINUX_NPM_TOKEN }}
          PACKAGES_JSON: ${{ matrix.packages_json }}
        run: |
          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }
          export -f retry_with_backoff

          PACKAGES=()
          while IFS= read -r package_dir; do
            PACKAGES+=("$package_dir")
          done < <(node -e 'for (const item of JSON.parse(process.env.PACKAGES_JSON)) console.log(item)')
          for package_dir in "${PACKAGES[@]}"; do
            echo "Publishing $package_dir to default registry"
            (
              cd "$package_dir"
              # 清理包目录里的临时 registry 配置，保留仓库根目录中 setup-node 生成的默认 registry 鉴权配置
              rm -f .npmrc

              # 获取当前版本号
              CURRENT_VERSION=$(node -p "require('./package.json').version")
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              echo "Current version: $CURRENT_VERSION"

              # 检查当前版本是否已在 NPM registry 上发布
              if npm view $PACKAGE_NAME@$CURRENT_VERSION version &> /dev/null; then
                echo "版本 $CURRENT_VERSION 已存在，尝试取消发布..."
                retry_with_backoff 3 3 npm unpublish $PACKAGE_NAME@$CURRENT_VERSION --force
                sleep 5
              fi

              # 发布
              retry_with_backoff 5 5 npm publish --access public
            )
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              exit "$STATUS"
            fi
          done

      - name: Notify cache bump
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          NOTIFY_URL: ${{ secrets.CN_LINUX_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.CN_LINUX_NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL or NOTIFY_TOKEN not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response.txt || true
          fi

  publish-registry2:
    needs:
      - validate
      - detect-changes
    if: ${{ github.event_name == 'push' && needs.detect-changes.outputs.matrix != '{"include":[]}' && github.ref == 'refs/heads/deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - name: Check UPDATE_ALL flag
        id: check-update-all
        run: |
          if [[ "${{ secrets.UPDATE_ALL }}" == "true" ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-update-all.outputs.should_skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-update-all.outputs.should_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build package
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          PACKAGES_JSON: ${{ matrix.packages_json }}
        run: |
          PACKAGES=()
          while IFS= read -r package_dir; do
            PACKAGES+=("$package_dir")
          done < <(node -e 'for (const item of JSON.parse(process.env.PACKAGES_JSON)) console.log(item)')
          for package_dir in "${PACKAGES[@]}"; do
            echo "Building $package_dir"
            (
              cd "$package_dir"
              npm run build --if-present
            )
          done

      - name: Publish to Registry 2
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          REGISTRY_2: ${{ secrets.EU_LINUX_REGISTRY_URL }}
          TOKEN_2: ${{ secrets.EU_LINUX_NPM_TOKEN }}
          PACKAGES_JSON: ${{ matrix.packages_json }}
        run: |
          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          if [ -z "$REGISTRY_2" ] || [ -z "$TOKEN_2" ]; then
            echo "Registry 2 secrets not set, skipping."
            exit 0
          fi

          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2" | sed 's/^https\?:\/\///')
          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2_NO_PROTO" | sed 's/\/$//')

          PACKAGES=()
          while IFS= read -r package_dir; do
            PACKAGES+=("$package_dir")
          done < <(node -e 'for (const item of JSON.parse(process.env.PACKAGES_JSON)) console.log(item)')
          for package_dir in "${PACKAGES[@]}"; do
            echo "Publishing $package_dir to Registry 2"
            (
              cd "$package_dir"
              echo "registry=$REGISTRY_2" > .npmrc
              echo "//$REGISTRY_2_NO_PROTO/:_authToken=$TOKEN_2" >> .npmrc
              trap 'rm -f .npmrc' EXIT

              CURRENT_VERSION=$(node -p "require('./package.json').version")
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              echo "Current version: $CURRENT_VERSION"

              if npm view $PACKAGE_NAME@$CURRENT_VERSION version &> /dev/null; then
                echo "Version $CURRENT_VERSION exists on $REGISTRY_2, unpublishing..."
                retry_with_backoff 3 3 npm unpublish $PACKAGE_NAME@$CURRENT_VERSION --force
                sleep 5
              fi

              retry_with_backoff 5 5 npm publish --access public
            )
          done

      - name: Notify cache bump for Registry 2
        if: steps.check-update-all.outputs.should_skip != 'true'
        env:
          NOTIFY_URL: ${{ secrets.EU_LINUX_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.EU_LINUX_NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL_2 or NOTIFY_TOKEN_2 not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response_2.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification (Registry 2) request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification (Registry 2) sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification (Registry 2) failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response_2.txt || true
          fi

  build-and-publish-all:
    needs:
      - validate
      - detect-changes
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy' }}
    runs-on: [self-hosted, ailydeMac-mini, macOS, ARM64]
    timeout-minutes: 240
    outputs:
      should_run: ${{ steps.check-update-all.outputs.should_run }}
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    steps:
      - name: Check UPDATE_ALL flag
        id: check-update-all
        run: |
          if [[ "${{ secrets.UPDATE_ALL }}" == "true" ]]; then
            echo "should_run=publish-all" >> $GITHUB_OUTPUT
          else
            echo "should_run=skip-all" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy' && steps.check-update-all.outputs.should_run == 'publish-all' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.CN_LINUX_REGISTRY_URL }}

      - name: Publish All to Default Registry
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CN_LINUX_NPM_TOKEN }}
        run: |
          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }
          export -f retry_with_backoff

          publish_default_one() {
            local dir="$1"
            (
              cd "$dir"
              rm -f .npmrc

              echo "发布 $dir"
              CURRENT_VERSION=$(node -p "require('./package.json').version")
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              echo "当前版本: $CURRENT_VERSION"

              if npm view $PACKAGE_NAME@$CURRENT_VERSION version &> /dev/null; then
                echo "版本 $CURRENT_VERSION 已存在，尝试取消发布..."
                retry_with_backoff 3 3 npm unpublish $PACKAGE_NAME@$CURRENT_VERSION --force
                sleep 5
              fi

              retry_with_backoff 5 5 npm publish --access public
            )
          }

          FIRST_LEVEL_DIRS=()
          while IFS= read -r dir; do
            FIRST_LEVEL_DIRS+=("$dir")
          done < <(node -e "for (const item of require('./scripts/genjson').getPublishablePackages(process.cwd())) console.log(item.folderName)")

          echo "要发布的一级目录包: ${FIRST_LEVEL_DIRS[*]}"

          for dir in "${FIRST_LEVEL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "目录 $dir 不存在，跳过..."
              continue
            fi

            publish_default_one "$dir"
          done

      - name: Notify cache bump
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        env:
          NOTIFY_URL: ${{ secrets.CN_LINUX_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.CN_LINUX_NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL or NOTIFY_TOKEN not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response.txt || true
          fi

  publish-registry2-all:
    needs:
      - validate
      - detect-changes
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      should_run: ${{ steps.check-update-all.outputs.should_run }}
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_FETCH_TIMEOUT: 300000
    steps:
      - name: Check UPDATE_ALL flag
        id: check-update-all
        run: |
          if [[ "${{ secrets.UPDATE_ALL }}" == "true" ]]; then
            echo "should_run=publish-all" >> $GITHUB_OUTPUT
          else
            echo "should_run=skip-all" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish All to Registry 2
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        env:
          REGISTRY_2: ${{ secrets.EU_LINUX_REGISTRY_URL }}
          TOKEN_2: ${{ secrets.EU_LINUX_NPM_TOKEN }}
        run: |
          retry_with_backoff() {
            local max_attempts="$1"
            local sleep_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          if [ -z "$REGISTRY_2" ] || [ -z "$TOKEN_2" ]; then
            echo "Registry 2 secrets not set, skipping."
            exit 0
          fi

          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2" | sed 's/^https\?:\/\///')
          REGISTRY_2_NO_PROTO=$(echo "$REGISTRY_2_NO_PROTO" | sed 's/\/$//')

          FIRST_LEVEL_DIRS=()
          while IFS= read -r dir; do
            FIRST_LEVEL_DIRS+=("$dir")
          done < <(node -e "for (const item of require('./scripts/genjson').getPublishablePackages(process.cwd())) console.log(item.folderName)")

          echo "要发布的一级目录包: ${FIRST_LEVEL_DIRS[*]}"

          for dir in "${FIRST_LEVEL_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "目录 $dir 不存在，跳过..."
              continue
            fi

            (
              cd "$dir"
              echo "registry=$REGISTRY_2" > .npmrc
              echo "//$REGISTRY_2_NO_PROTO/:_authToken=$TOKEN_2" >> .npmrc
              trap 'rm -f .npmrc' EXIT

              echo "发布 $dir 到 Registry 2"
              CURRENT_VERSION=$(node -p "require('./package.json').version")
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              echo "当前版本: $CURRENT_VERSION"

              if npm view $PACKAGE_NAME@$CURRENT_VERSION version &> /dev/null; then
                echo "Version $CURRENT_VERSION exists on $REGISTRY_2, unpublishing..."
                retry_with_backoff 3 3 npm unpublish $PACKAGE_NAME@$CURRENT_VERSION --force
                sleep 5
              fi

              retry_with_backoff 5 5 npm publish --access public
            )
          done

      - name: Notify cache bump for Registry 2
        if: steps.check-update-all.outputs.should_run == 'publish-all'
        env:
          NOTIFY_URL: ${{ secrets.EU_LINUX_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.EU_LINUX_NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then
            echo "NOTIFY_URL_2 or NOTIFY_TOKEN_2 not set, skipping."
            exit 0
          fi
          echo "Sending POST request to $NOTIFY_URL"
          set +e
          HTTP_STATUS=$(curl -s -o /tmp/notify_response_2.txt -w "%{http_code}" --max-time 30 \
            -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notification (Registry 2) request failed (curl exit code $CURL_EXIT)"
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Notification (Registry 2) sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Notification (Registry 2) failed with HTTP status $HTTP_STATUS"
            cat /tmp/notify_response_2.txt || true
          fi

  genJson-and-upload:
    needs:
      - validate
      - detect-changes
      - build-and-publish
      - publish-registry2
      - build-and-publish-all
      - publish-registry2-all
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.detect-changes.result == 'success' &&
        contains(fromJson('["success","skipped"]'), needs.build-and-publish.result) &&
        contains(fromJson('["success","skipped"]'), needs.publish-registry2.result) &&
        contains(fromJson('["success","skipped"]'), needs.build-and-publish-all.result) &&
        contains(fromJson('["success","skipped"]'), needs.publish-registry2-all.result)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate JSON
        run: node scripts/genjson.js

      - name: Generate AI libraries JSON
        run: node scripts/genjson-ai.js

      - name: Generate library info files
        run: node scripts/generate-info.js --all

      - name: Generate libraries index
        run: node scripts/generate-libraries-index.js

      - name: Generate package folder map
        run: node scripts/generate-package-folder-map.js

      - name: Validate generated JSON files
        run: |
          for file in libraries-linux.json libraries-linux-ai.json libraries-linux-index.json package-folder-map-linux.json tags-linux.json; do
            if [ -f "./$file" ]; then
              echo "$file exists"
              node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
            else
              echo "$file does not exist"
              ls -la
              exit 1
            fi
          done

      - name: Upload JSON files to RustFS
        env:
          RUSTFS_ENDPOINT: ${{ secrets.RUSTFS_ENDPOINT }}
          RUSTFS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          RUSTFS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          RUSTFS_BUCKET: ${{ secrets.RUSTFS_BUCKET }}
          RUSTFS_TARGET: ${{ secrets.RUSTFS_TARGET }}
        run: |
          if [ -z "$RUSTFS_ENDPOINT" ] || [ -z "$RUSTFS_ACCESS_KEY_ID" ] || [ -z "$RUSTFS_SECRET_ACCESS_KEY" ] || [ -z "$RUSTFS_BUCKET" ]; then
            echo "RustFS secrets not set, skipping."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$RUSTFS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$RUSTFS_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="us-east-1"
          TARGET=$(printf '%s' "$RUSTFS_TARGET" | sed 's#^/*##; s#/*$##')
          PREFIX="${TARGET:+${TARGET}/}"
          for file in libraries-linux.json libraries-linux-ai.json libraries-linux-index.json package-folder-map-linux.json tags-linux.json; do
            aws --endpoint-url "$RUSTFS_ENDPOINT" s3 cp "$file" "s3://${RUSTFS_BUCKET}/${PREFIX}${file}" --no-progress
          done

      - name: Prepare R2 Upload
        run: |
          mkdir -p r2_json
          cp libraries-linux.json r2_json/
          cp libraries-linux-ai.json r2_json/
          cp libraries-linux-index.json r2_json/
          cp package-folder-map-linux.json r2_json/
          cp tags-linux.json r2_json/

      - name: Upload JSON files to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'auto'
          R2_JSON_TARGET: ${{ secrets.R2_JSON_TARGET }}
        run: |
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET=$(printf '%s' "$R2_JSON_TARGET" | sed 's#^/*##; s#/*$##')
          PREFIX="${TARGET:+${TARGET}/}"
          CACHE_CONTROL="no-store, no-cache, must-revalidate, max-age=0"

          for file in r2_json/*.json; do
            name="$(basename "$file")"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$file" "s3://${R2_BUCKET}/${PREFIX}${name}" \
              --acl public-read \
              --content-type "application/json" \
              --cache-control "$CACHE_CONTROL" \
              --no-progress
          done


  update-last-deploy-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - validate
      - detect-changes
      - build-and-publish
      - publish-registry2
      - build-and-publish-all
      - publish-registry2-all
      - genJson-and-upload
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.detect-changes.result == 'success' &&
        contains(fromJson('["success","skipped"]'), needs.build-and-publish.result) &&
        contains(fromJson('["success","skipped"]'), needs.publish-registry2.result) &&
        contains(fromJson('["success","skipped"]'), needs.build-and-publish-all.result) &&
        contains(fromJson('["success","skipped"]'), needs.publish-registry2-all.result) &&
        needs.genJson-and-upload.result == 'success' &&
        (
          (
            needs.detect-changes.outputs.matrix != '{"include":[]}' &&
            needs.build-and-publish.result == 'success' &&
            needs.publish-registry2.result == 'success'
          ) ||
          (
            needs.build-and-publish-all.outputs.should_run == 'publish-all' &&
            needs.build-and-publish-all.result == 'success' &&
            needs.publish-registry2-all.outputs.should_run == 'publish-all' &&
            needs.publish-registry2-all.result == 'success'
          )
        )
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Update last deploy tag
        run: |
          git tag -f last-deploy "$GITHUB_SHA"
          git push --force origin refs/tags/last-deploy

  refresh-library-ratings:
    runs-on: ubuntu-latest
    needs:
      - update-last-deploy-tag
    if: ${{ needs.update-last-deploy-tag.result == 'success' }}

    steps:
      - name: Trigger library ratings refresh
        env:
          REFRESH_URL_CN: ${{ secrets.LIBRARY_RATINGS_REFRESH_URL_CN }}
          REFRESH_PASSWORD_CN: ${{ secrets.LIBRARY_RATINGS_REFRESH_PASSWORD_CN }}
          REFRESH_URL_EU: ${{ secrets.LIBRARY_RATINGS_REFRESH_URL_EU }}
          REFRESH_PASSWORD_EU: ${{ secrets.LIBRARY_RATINGS_REFRESH_PASSWORD_EU }}
        run: |
          trigger_refresh() {
            local target_name="$1"
            local refresh_url="$2"
            local refresh_password="$3"
            local response_file="$4"

            if [ -z "$refresh_url" ] || [ -z "$refresh_password" ]; then
              echo "${target_name} refresh config not set, skipping."
              return 0
            fi

            echo "Sending ${target_name} refresh request to $refresh_url"
            set +e
            HTTP_STATUS=$(curl -s -o "$response_file" -w "%{http_code}" --max-time 30 \
              -X POST "$refresh_url" \
              -H "X-Refresh-Password: $refresh_password" \
              -H "Content-Type: application/json" \
              -d '{}')
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "::warning::${target_name} refresh request failed (curl exit code $CURL_EXIT)"
            elif [ "$HTTP_STATUS" -eq 202 ] || { [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; }; then
              echo "${target_name} refresh accepted successfully (HTTP $HTTP_STATUS)"
            else
              echo "::warning::${target_name} refresh failed with HTTP status $HTTP_STATUS"
              cat "$response_file" || true
            fi
          }

          trigger_refresh "CN library ratings server" "$REFRESH_URL_CN" "$REFRESH_PASSWORD_CN" "/tmp/library_ratings_refresh_response_cn.txt"
          trigger_refresh "EU library ratings server" "$REFRESH_URL_EU" "$REFRESH_PASSWORD_EU" "/tmp/library_ratings_refresh_response_eu.txt"
